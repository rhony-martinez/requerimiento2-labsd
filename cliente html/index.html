<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Spotify - Cliente web</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <header>
        <h1>🎧 Spotify</h1>
        <label>Usuario (id): <input id="usuario-id" type="number" min="1"></label>
    </header>

    <main id="pantalla"></main>

    <section id="zona-reproductor">
        <h3 id="status">Selecciona un audio para reproducir</h3>
        <audio id="audio-player" controls style="display:none"></audio>
        <div id="barra-reacciones"></div>
        <div id="contenedor-reacciones"></div>
        <p id="oyentes"></p>
        <div id="log"></div>
    </section>

    <!-- El orden importa: config primero porque el bundle lee GATEWAY_URL -->
    <script src="./config.js"></script>
    <script src="./bundle.js"></script>
    <script src="./funciones.js"></script>
    <script src="./api.js"></script>
    <script src="./catalogo.js"></script>
    <script src="./pagos.js"></script>
    <script src="./admin.js"></script>
    <script src="./reacciones.js"></script>
</body>

</html>
